<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e29b68" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d34"/>
      <stop offset="100%" stop-color="#1a1a1f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)" />
  <rect width="400" height="500" fill="url(#glow)" />

  <!-- Subtle Grid lines -->
  <path d="M0 125 H400 M0 250 H400 M0 375 H400 M100 0 V500 M200 0 V500 M300 0 V500" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Minimalist Portrait Silhouette -->
  <g transform="translate(0, 20)">
    <!-- Head -->
    <circle cx="200" cy="180" r="65" fill="url(#avatarGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <!-- Shoulders -->
    <path d="M90 380 C90 280, 140 260, 200 260 C260 260, 310 280, 310 380 Z" fill="url(#avatarGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <!-- Badge / Camera Placeholder Label -->
  <g transform="translate(200, 420)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#86868b" text-anchor="middle" letter-spacing="1.5">FOTO MIEMBRO</text>
  </g>
</svg>
